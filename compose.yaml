name: openrouter-webhooks

services:
  web:
    build:
      context: .
      args:
        REVISION: ${REVISION:-${HATCHBOX_REVISION:-development}}
    image: openrouter-webhooks:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      DATA_DIR: /data
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY before starting the service}
      WEBHOOK_HOSTS: ${WEBHOOK_HOSTS:-}
      MODEL_CONCURRENCY: ${MODEL_CONCURRENCY:-300}
      WEBHOOK_CONCURRENCY: ${WEBHOOK_CONCURRENCY:-50}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-10m}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-15s}
      WEBHOOK_ATTEMPTS: ${WEBHOOK_ATTEMPTS:-12}
      MAX_JOBS: ${MAX_JOBS:-10000}
      RETENTION: ${RETENTION:-24h}
    volumes:
      - jobs:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jobs:
    name: openrouter-webhooks-data
