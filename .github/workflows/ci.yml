name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=120s -v ./...
      - run: go build ./...
      - name: Build and smoke-test Docker deployment
        env:
          DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PORT: '18080'
          REVISION: ${{ github.sha }}
        run: |
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 90
          bin/check-deploy http://127.0.0.1:18080 "$REVISION"
          docker compose exec -T web sh -c 'test "$(id -u)" = 10001 && test -w /data'
      - name: Stop test containers
        if: always()
        env:
          DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PORT: '18080'
        run: docker compose down --timeout 60
